# O pipeline medalhão (Lakeflow Spark Declarative Pipelines, SQL, serverless).
# Silver = schema padrão do pipeline (lida pelo nome curto); a gold escreve com o nome completo
# lakehouse_vertice.gold.<tabela>.
resources:
  pipelines:
    vertice_medalhao:
      name: vertice_medalhao
      catalog: ${var.catalog}
      schema: silver
      serverless: true
      photon: true
      continuous: false
      libraries:
        - glob:
            include: ../src/silver/**
        - glob:
            include: ../src/gold/**
