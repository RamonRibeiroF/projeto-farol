# O job vertice_farol: a noite inteira do Farol, da ingestão à IA, em 6 tarefas.
#   ingestao_feriados    (notebook) feriados nacionais da API pública na bronze
#   ingestao_data_lake   (notebook) arquivos das 4 ferramentas e do RH baixados do data lake para o volume, e a bronze
#   conferencia_bronze   (sql)      confere as 9 tabelas da bronze contra a contagem esperada; falha se divergir
#   medalhao             (pipeline) vertice_medalhao: silver (7 tabelas) e gold
#   testes_de_qualidade  (sql)      10 testes da silver e da gold; falha dizendo qual quebrou
#   status_com_ia        (sql)      gold.status_estruturado: IA lê o texto do status, MERGE só dos status novos
# As duas ingestões rodam em paralelo, e os testes e a IA também, depois do medalhão.
# As chaves do data lake NÃO ficam aqui: são variáveis do bundle (ver databricks.yml), com o valor em
# .databricks/bundle/dev/variable-overrides.json, que o .gitignore deixa fora do Git.
resources:
  jobs:
    vertice_farol:
      name: vertice_farol
      schedule:
        # toda segunda às 6h; no target dev o preset trigger_pause_status deixa pausado
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: America/Sao_Paulo
      tasks:
        - task_key: ingestao_feriados
          notebook_task:
            notebook_path: ../ingestao/01_ingestao_api.py
          run_if: ALL_SUCCESS
          timeout_seconds: 0

        - task_key: ingestao_data_lake
          environment_key: Default
          notebook_task:
            base_parameters:
              AWS_ACCESS_KEY_ID: ${var.s3_access_key_id}
              AWS_DEFAULT_REGION: us-east-1
              AWS_SECRET_ACCESS_KEY: ${var.s3_secret_access_key}
              S3_ENDPOINT: https://tjzydhzjykjryzmjqlur.storage.supabase.co/storage/v1/s3
            notebook_path: ../ingestao/02_ingestao_boto3.py
          run_if: ALL_SUCCESS
          timeout_seconds: 0

        # confere as 9 tabelas da bronze contra a contagem esperada (seed 42); falha se divergir
        - task_key: conferencia_bronze
          depends_on:
            - task_key: ingestao_feriados
            - task_key: ingestao_data_lake
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/conferencia/00-conferencia-bronze.sql

        # o pipeline Lakeflow: silver e gold
        - task_key: medalhao
          depends_on:
            - task_key: conferencia_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.vertice_medalhao.id}

        # os 10 testes de qualidade da silver e da gold; falha (raise_error) dizendo qual teste quebrou
        - task_key: testes_de_qualidade
          depends_on:
            - task_key: medalhao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/testes/testes.sql

        # o texto livre do status vira coluna (IA nos últimos 90 dias com bloqueio); em paralelo com os testes
        - task_key: status_com_ia
          depends_on:
            - task_key: medalhao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/ia/status_estruturado.sql

      email_notifications:
        no_alert_for_skipped_runs: false
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      # uma execução por vez: duas ao mesmo tempo apagariam a bronze uma da outra
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
