# O job vertice_farol: ingestão da bronze, conferência e o pipeline medalhão (silver).
# Nasceu do job "Ingestao" da etapa 2 (`bundle generate job`); os notebooks são os de ingestao/.
# As chaves do data lake NÃO ficam aqui: são variáveis do bundle (ver databricks.yml), com o valor em
# .databricks/bundle/dev/variable-overrides.json, que o .gitignore deixa fora do Git.
resources:
  jobs:
    vertice_farol:
      name: vertice_farol
      schedule:
        # toda segunda às 6h; pausado até o job completo estar pronto
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: America/Sao_Paulo
        pause_status: PAUSED
      tasks:
        - task_key: ingestao_feriados
          notebook_task:
            notebook_path: ../ingestao/01_ingestao_api.py
          run_if: ALL_SUCCESS
          timeout_seconds: 0

        - task_key: ingestao_data_lake
          environment_key: Default
          notebook_task:
            base_parameters:
              AWS_ACCESS_KEY_ID: ${var.s3_access_key_id}
              AWS_DEFAULT_REGION: us-east-1
              AWS_SECRET_ACCESS_KEY: ${var.s3_secret_access_key}
              S3_ENDPOINT: https://tjzydhzjykjryzmjqlur.storage.supabase.co/storage/v1/s3
            notebook_path: ../ingestao/02_ingestao_boto3.py
          run_if: ALL_SUCCESS
          timeout_seconds: 0

        # confere as 9 tabelas da bronze contra a contagem esperada (seed 42); falha se divergir
        - task_key: conferencia_bronze
          depends_on:
            - task_key: ingestao_feriados
            - task_key: ingestao_data_lake
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/conferencia/00-conferencia-bronze.sql

        # o pipeline Lakeflow: silver (e, quando a gold entrar, a gold)
        - task_key: medalhao
          depends_on:
            - task_key: conferencia_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.vertice_medalhao.id}

      email_notifications:
        no_alert_for_skipped_runs: false
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
